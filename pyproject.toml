[project]
name = "cachecache"
version = "1.0.0"
description = "Python package for easy function caching, allowing users to customize cache behavior at call-time."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Maxime Beau", email = "m.beau047@gmail.com" },
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "joblib>=1.4",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/m-beau/cachecache"
Repository = "https://github.com/m-beau/cachecache"
Issues = "https://github.com/m-beau/cachecache/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cachecache"]
